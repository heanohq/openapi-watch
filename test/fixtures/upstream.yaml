openapi: 3.0.1
info:
  title: Example API
  version: '1.1'
paths:
  /forms:
    get:
      summary: List forms
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  forms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Form'
    post:
      summary: Create a form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
  /forms/{id}:
    get:
      summary: Get a form
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '410':
          description: Gone
components:
  schemas:
    Form:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        description:
          type: string
          description: Shown to editors and on the form page.
        tags:
          type: array
          items:
            type: string
